  <!-- 👇 CSS FIX CHUẨN ĐÚNG THEO GIAO DIỆN 👇 -->
  <!-- ================================================================== -->
  <style id="custom-css">
    /* 1. Đặt avatar nằm giữa chiều dọc của vùng nội dung phía trên */
    .widget-freemode-icon {
      position: absolute;
      top: 9px !important;
      left: 18px;
    }

    /* 2. Style Avatar mặc định: Nền xám trơn + chữ trắng */
    .avatar {
      overflow: hidden;
      width: var(--avatar-size, 28px);
      height: var(--avatar-size, 28px);
      border-radius: 50%;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .avatar > span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #8c8c8c !important;
      font-weight: bold;
      font-size: 11px;
      line-height: 1;
    }
    .avatar > span > em {
      color: #ffffff !important;
      background: none !important;
      -webkit-text-fill-color: #ffffff !important;
      font-style: normal;
    }

    /* 3. Khung tên Idol: Chuẩn khung tab màu đen gốc và căn giữa */
    .widget-freemode-nick {
      position: relative;
      width: 86px;
      height: 18px;
      margin: 0 auto;
    }
    .widget-freemode-nick .marquee {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 148px;
      height: 36px;
      color: #fff;
      font-size: var(--font-size-5);
      font-weight: bold;
      line-height: 36px;
      text-align: center;
      transform: scale(0.5) translate(-50%, -50%);
      transform-origin: left top;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chạy cuộn khi tên dài */
    .mca-marquee-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation-name: mcaMarqueeScroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      font-size: var(--font-size-5);
      font-weight: bold;
      color: #fff;
      line-height: 36px;
    }
    .mca-marquee-track .mca-gap {
      display: inline-block;
      width: 32px;
      flex: none;
    }
    @keyframes mcaMarqueeScroll {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }

    /* 4. Mũi tên chạy khi đạt mục tiêu: dùng CSS mới của widget (animate / .widget-freemode-animate),
          chỉ hiện khi thanh có class "over"; ảnh mũi tên nhúng base64 để chạy độc lập */
    .widget-freemode-animate { display: none; }
    .widget-freemode-bar.over .widget-freemode-animate { display: flex; }
    .widget-freemode-animate > i {
      background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACkAAAAqBAMAAADc2m9rAAAAG1BMVEX///8AAAD///////////////////////////8NUEtIAAAACXRSTlNMAEIKCTQ5HBMC5+OfAAAAj0lEQVQoz2XOwQmDABAF0SUVxCTkHIgFqBWoFViKJVi6DKhfmH98DMvWUscefXPuWVud+9/0W4mjn1/iaDMrRh2jjlHHqOJDFaOOUceoY9Qx6hh1jDpGHaOOUceo4y46RMdL37nQckHphCrlM6eoU1Qp6hR1ijpFnaJOUaeoU9Qp6hR1ijpFX0rRVSm6JI3uk/IqeEHlb8sAAAAASUVORK5CYII=);
    }

    /* 5. Animation cho thanh đếm điểm */
    /* Thanh chạy mượt khi tăng điểm */
    .widget-freemode-bar > p { transition: width .9s cubic-bezier(.22, 1, .36, 1); will-change: width; }
    /* Đồng hồ đổi sang đỏ mượt khi còn <= 10 giây (class "warning" gốc của widget) */
    .widget-freemode-time { transition: color .4s ease; }
    .widget-freemode-time.warning { color: var(--color-danger); }
    /* Số không bị xô lệch khi đang chuyển */
    .widget-freemode-bar:before,
    .widget-freemode-bar:after { font-variant-numeric: tabular-nums; }
    /* Số phóng to một chút khi đang chạy lên, rồi thu về mượt khi dừng */
    .widget-freemode-bar:before,
    .widget-freemode-bar:after { transition: transform .45s cubic-bezier(.22, 1, .36, 1); }
    .widget-freemode-bar.mca-count-left:before { transform: scale(.58); }
    .widget-freemode-bar.mca-count-over:after { transform: scale(.58); }
  </style>
</head>
<body>

<div id="app">
  <div class="widget" style="transform: scale(2.5);">
    <div class="widget-freemode">
      
      <!-- Avatar Idol -->
      <div class="widget-freemode-icon" id="w-avatar-wrap" style="display:none;">
        <div class="avatar" id="w-avatar" style="--avatar-size:28px;"></div>
      </div>

      <!-- Thẻ tên Idol -->
      <div class="widget-freemode-nick">
        <div class="marquee" id="w-name-marquee"></div>
      </div>

      <!-- Thời gian đếm ngược hoặc trạng thái -->
      <div class="widget-freemode-time" id="w-time-box">
        <span id="w-timer">00:00</span>
      </div>

      <!-- Thanh tiến trình & Điểm số (Mặc định không có OVER) -->
      <div class="widget-freemode-bar unlimit" id="w-bar-wrap" data-left="0" data-right="">
        <p class="nocorner" id="w-bar" style="width: 0%;"></p>
        <span class="widget-freemode-animate"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>

    </div>
  </div>
</div>

<script>
let state = null;

function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function getTextWidth(text) {
  const fontSize = 20;
  const fontFamily = "'SF Pro Text', 'PingFangSC', 'Microsoft YaHei', sans-serif";
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = `bold ${fontSize}px ${fontFamily}`;
  return ctx.measureText(text).width;
}

function setupMarquee(marqueeEl, text) {
  if (!marqueeEl) return;
  if (marqueeEl.dataset.mcaName === text) return;
  marqueeEl.dataset.mcaName = text;

  marqueeEl.innerHTML = "";
  const containerWidth = 148; 
  const textWidth = getTextWidth(text);

  if (textWidth > containerWidth) {
    marqueeEl.style.justifyContent = "flex-start";
    const track = document.createElement("div");
    track.className = "mca-marquee-track";
    
    const createClone = () => {
      const span = document.createElement("span");
      span.textContent = text;
      const gap = document.createElement("span");
      gap.className = "mca-gap";
      return [span, gap];
    };
    createClone().forEach(el => track.appendChild(el));
    createClone().forEach(el => track.appendChild(el));
    
    const speed = 40;
    const duration = Math.max(4, (textWidth + 32) / speed);
    track.style.animationDuration = duration + "s";
    
    marqueeEl.appendChild(track);
  } else {
    marqueeEl.style.justifyContent = "center";
    const span = document.createElement("span");
    span.textContent = text;
    span.style.cssText = "display:block; width:100%; text-align:center; white-space:nowrap; line-height:36px;";
    marqueeEl.appendChild(span);
  }
}

function renderCore() {
  if (!state) return;

  const idol = state.idols ? state.idols.find(i => i.active) : null;
  const t = state.timer || { finished: false, remaining: 0, duration: 0 };

  // Render Avatar
  const avatarWrap = document.getElementById("w-avatar-wrap");
  const avatarEl = document.getElementById("w-avatar");
  if (avatarWrap && avatarEl) {
    let avatarUrl = idol ? (idol.avatar || "").trim() : "";
    if (avatarUrl && (avatarUrl.includes("tiktokcdn.com") || avatarUrl.includes("byteoversea.com")) && !avatarUrl.startsWith("/api/avatar/proxy")) {
      avatarUrl = `/api/avatar/proxy?url=${encodeURIComponent(avatarUrl)}`;
    }
    if (avatarUrl) {
      avatarEl.innerHTML = `<img src="${avatarUrl}" onerror="this.src=''" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;">`;
      avatarWrap.style.display = "";
    } else {
      const initials = idol && idol.name ? idol.name.trim().slice(0, 2).toUpperCase() : "?";
      avatarEl.innerHTML = `<span><em>${initials}</em></span>`;
      avatarWrap.style.display = "";
    }
  }

  // Render Tên Idol
  const nameMarqueeEl = document.getElementById("w-name-marquee");
  const currentName = idol ? idol.name.toUpperCase() : "---";
  setupMarquee(nameMarqueeEl, currentName);

  const totalScore = idol ? (idol.score || 0) : 0;
  const sessionBase = idol ? (idol.session_base || 0) : 0;
  const sessionScore = Math.max(0, totalScore - sessionBase);

  const timeBoxEl = document.getElementById("w-time-box");
  const barEl = document.getElementById("w-bar");
  const barWrap = document.getElementById("w-bar-wrap");

  const tgt = state.target || { enabled: false };
  const standingBy = !t.running && !t.finished && !t.finishing && t.duration > 0 && t.remaining === t.duration;
  const isFinishing = !!t.finishing; // grace period "Thống kê"

  if (tgt.enabled) {
    const over = Math.max(0, sessionScore - tgt.score);
    const pct = tgt.score > 0 ? Math.min(100, (sessionScore / tgt.score) * 100) : 0;

    if (tgt.reached) {
      if (barWrap) {
        barWrap.classList.remove("unlimit");
        barWrap.classList.add("over");
        barWrap.setAttribute("data-left", sessionScore.toLocaleString());
        barWrap.setAttribute("data-right", over > 0 ? "OVER+" + over.toLocaleString() : "");
      }
      if (barEl) barEl.style.width = "100%";
      if (t.finished) {
        timeBoxEl.className = "widget-freemode-time success";
        timeBoxEl.textContent = "Thành công";
      } else if (isFinishing) {
        timeBoxEl.className = "widget-freemode-time settling";
        timeBoxEl.textContent = "Thống kê";
      } else if (standingBy) {
        timeBoxEl.className = "widget-freemode-time settling";
        timeBoxEl.textContent = "Chuẩn bị";
      } else {
        // Timer vẫn đang chạy — giữ đếm ngược bình thường
        timeBoxEl.className = "widget-freemode-time";
        timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;
      }
    } else {
      if (barWrap) {
        barWrap.classList.remove("unlimit");
        barWrap.classList.remove("over");
        barWrap.setAttribute("data-left", sessionScore.toLocaleString());
        barWrap.setAttribute("data-right", tgt.score.toLocaleString());
      }
      if (barEl) barEl.style.width = Math.max(20, pct) + "%";
      if (t.finished) {
        timeBoxEl.className = "widget-freemode-time fail";
        timeBoxEl.textContent = "Thất bại";
      } else if (isFinishing) {
        timeBoxEl.className = "widget-freemode-time settling";
        timeBoxEl.textContent = "Thống kê";
      } else if (standingBy) {
        timeBoxEl.className = "widget-freemode-time settling";
        timeBoxEl.textContent = "Chuẩn bị";
      } else {
        timeBoxEl.className = "widget-freemode-time";
        timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;
      }
    }
  } else {
    // Không bật Target (Chế độ tự do / vô hạn): Không hiện bất kỳ chữ OVER nào
    if (barWrap) {
      barWrap.classList.add("unlimit");
      barWrap.classList.remove("over");
      barWrap.setAttribute("data-left", sessionScore.toLocaleString());
      barWrap.removeAttribute("data-right");
    }

    if (t.finished) {
      timeBoxEl.className = "widget-freemode-time success";
      timeBoxEl.textContent = "Thành công";
      if (barEl) barEl.style.width = "100%";
    } else if (isFinishing) {
      // Grace period: giữ thanh bar như cũ, hiện "Thống kê"
      timeBoxEl.className = "widget-freemode-time settling";
      timeBoxEl.textContent = "Thống kê";
    } else if (standingBy) {
      timeBoxEl.className = "widget-freemode-time settling";
      timeBoxEl.textContent = "Chuẩn bị";
      if (barEl) barEl.style.width = "20%";
    } else {
      timeBoxEl.className = "widget-freemode-time";
      timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;

      const elapsed = t.duration - t.remaining;
      const pct = t.duration > 0 ? Math.min(100, (elapsed / t.duration) * 100) : 0;
      if (barEl) barEl.style.width = Math.max(20, pct) + "%";
    }
  }
}


// ===== Chuyển số mượt trên thanh điểm =====
const MCA_TWEEN_MS = 900;
const mcaEase = t => 1 - Math.pow(1 - t, 4); // easeOutQuart
const mcaNum = { left: null, over: null }; // { shown, from, to, start }
let mcaRaf = 0;

function mcaParse(str) {
  const n = parseInt(String(str || "").replace(/\D/g, ""), 10);
  return isNaN(n) ? null : n;
}

function mcaTrack(key, target, now) {
  let st = mcaNum[key];
  if (target === null) { mcaNum[key] = null; return; }
  if (!st) { mcaNum[key] = { shown: target, from: target, to: target, start: now }; return; }
  if (target === st.to) return;
  if (target < st.shown) {            // điểm bị reset/giảm -> nhảy thẳng
    mcaNum[key] = { shown: target, from: target, to: target, start: now };
    return;
  }
  st.from = st.shown; st.to = target; st.start = now;
}

function mcaStep(now) {
  let active = false;
  for (const key of ["left", "over"]) {
    const st = mcaNum[key];
    if (!st || st.shown === st.to) continue;
    const t = Math.min(1, (now - st.start) / MCA_TWEEN_MS);
    st.shown = t >= 1 ? st.to : Math.round(st.from + (st.to - st.from) * mcaEase(t));
    if (st.shown !== st.to) active = true;
  }
  mcaPaint();
  mcaRaf = active ? requestAnimationFrame(mcaStep) : 0;
}

function mcaPaint() {
  const bar = document.getElementById("w-bar-wrap");
  if (!bar) return;
  if (mcaNum.left) bar.setAttribute("data-left", mcaNum.left.shown.toLocaleString());
  if (mcaNum.over && bar.classList.contains("over")) {
    bar.setAttribute("data-right", "OVER+" + mcaNum.over.shown.toLocaleString());
  }
  // Đang chạy số -> phóng to nhẹ
  const run = k => !!(mcaNum[k] && mcaNum[k].shown !== mcaNum[k].to);
  bar.classList.toggle("mca-count-left", run("left"));
  bar.classList.toggle("mca-count-over", run("over") && bar.classList.contains("over"));
}

function mcaScoreAnim() {
  const bar = document.getElementById("w-bar-wrap");
  if (!bar) return;
  const now = performance.now();
  const right = bar.getAttribute("data-right") || "";
  mcaTrack("left", mcaParse(bar.getAttribute("data-left")), now);
  mcaTrack("over", /^OVER\+/.test(right) ? mcaParse(right) : null, now);
  mcaPaint(); // ghi đè ngay giá trị cuối mà renderCore vừa đặt -> không bị giật
  if (!mcaRaf) {
    const busy = ["left", "over"].some(k => mcaNum[k] && mcaNum[k].shown !== mcaNum[k].to);
    if (busy) mcaRaf = requestAnimationFrame(mcaStep);
  }
}

// Còn <= 10 giây -> đồng hồ màu đỏ
const MCA_WARN_SEC = 10;
function mcaTimerWarn() {
  if (!state) return;
  const t = state.timer || {};
  const box = document.getElementById("w-time-box");
  if (!box) return;
  const counting = !!box.querySelector("#w-timer");           // đang hiển thị số đếm
  const started = t.duration > 0 && t.remaining < t.duration; // đã chạy, không phải lúc chờ
  const warn = counting && started && t.remaining >= 0 && t.remaining <= MCA_WARN_SEC;
  box.classList.toggle("warning", warn);
}

function render() {
  renderCore();
  mcaScoreAnim();
  mcaTimerWarn();
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") {
        state = msg.data;
        render();
      } else if (msg.type === "target_reached") {
        // Không can thiệp DOM trực tiếp — render() sẽ xử lý đúng dựa trên state
      }
    } catch (e) {
      console.error("Lỗi parse WebSocket data:", e);
    }
  };
  
  ws.onclose = () => setTimeout(connect, 1500);
}

(function init() {
  const marqueeEl = document.getElementById("w-name-marquee");
  setupMarquee(marqueeEl, "---");
  connect();
})();
</script>
</body>
